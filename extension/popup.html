<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cookie Injector</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      body { font-family: Arial, Helvetica, sans-serif; width: 360px; padding: 12px; background:#0b1114; color:#e6eef2; }
      h3 { margin: 0 0 8px 0; }
      label { font-size: 13px; color:#b7c7d6; }
      input, button, textarea { width:100%; margin-top:8px; box-sizing:border-box; padding:8px; border-radius:6px; border:1px solid #26343b; background:#071014; color:#e6eef2; }
      button { cursor:pointer; background:linear-gradient(90deg,#00d4ff,#0099cc); color:#000; font-weight:700; padding:10px; }
      .note { font-size:12px; color:#8f9aa3; margin-top:8px; }
      #status { margin-top:10px; white-space:pre-wrap; font-size:13px; color:#cfe8ff; }
      .small { font-size:12px; color:#9fb4c6; }
    </style>
  </head>
  <body>
    <h3>Cookie Share Injector</h3>
    <label for="token">Cole o token ou a URL /share/ aqui:</label>
    <input id="token" placeholder="Ex.: https://localhost:3000/share/UUID ou só UUID" />

    <label class="small"><input type="checkbox" id="onlyCurrentDomain" /> Aplicar somente ao domínio da aba atual (recomendado)</label>

    <button id="injectBtn">Injetar Cookies</button>

    <div class="note">A extensão pedirá permissão para definir cookies nos hosts necessários. Use apenas localmente ou em ambiente controlado.</div>
    <div id="status"></div>

    <script src="popup.js"></script>
  </body>
</html>
